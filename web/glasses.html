<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1">
<title>Point & Go</title>
<style>
  html, body { margin: 0; padding: 0; width: 600px; height: 600px; background: #000; color: #fff;   /* black = transparent on waveguide */
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #arrowView { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding-bottom: 56px; }
  #arrow { width: 225px; height: 225px; transition: transform .12s linear; }
  #arrow path { fill: #fff; } #arrow.ahead path { fill: #3dff7a; } #arrow.lost path { fill: #555; }
  #dist { font-size: 62px; font-weight: 700; letter-spacing: 1px; line-height: 1; }
  #dest { font-size: 23px; line-height: 1.2; color: #fff; max-width: 570px; max-height: 56px; text-align: center; overflow: hidden; }
  #status { font-size: 24px; color: #aaa; min-height: 30px; } #status.ahead { color: #3dff7a; } #status.warn { color: #ffb84d; }
  #hdg { position: absolute; top: 14px; left: 16px; font-size: 18px; color: #8a8a8a; }
  #fixinfo { position: absolute; top: 14px; right: 16px; font-size: 18px; color: #8a8a8a; text-align: right; }
  #map { position: absolute; inset: 0; width: 600px; height: 600px; display: none; }
  #bar { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; gap: 10px; justify-content: center; }
  .focusable { background: none; border: 2px solid #444; color: #999; font-size: 18px; padding: 7px 14px; border-radius: 10px; }
  .focusable:focus { border-color: #fff; color: #fff; outline: none; }
</style>
</head>
<body>
<div id="arrowView">
  <svg id="arrow" class="lost" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L86 56 L62 56 L62 96 L38 96 L38 56 L14 56 Z"/></svg>
  <div id="dist">--</div>
  <div id="dest"></div>
  <div id="status" class="warn">Waiting for a fix from the phone…</div>
</div>
<canvas id="map" width="600" height="600"></canvas>
<div id="hdg">HDG --</div>
<div id="fixinfo"></div>
<div id="bar">
  <button id="bCal" class="focusable" tabindex="0">ALIGN</button>
  <button id="bDest" class="focusable" tabindex="0">DEST ▸</button>
  <button id="bMap" class="focusable" tabindex="0">MAP</button>
</div>
<script src="js/solver.js"></script>
<script src="js/sync.js"></script>
<script>
/* Point & Go, glasses side. 600x600, black background, D-pad focus + Enter/pinch only.
   Position comes from the phone's photo fix (no GPS). Heading: press ALIGN while facing the way the photo was shot,
   and the arrow then follows head turns from the photo's solved heading. Until ALIGN, the device compass is used if it reports north.
   ?demo=1 fakes a fix at 285 Jay St.   ?room=NAME pairs with a phone on the same room. */
const $ = id => document.getElementById(id), params = new URLSearchParams(location.search);
const AHEAD = 20, norm180 = PG.wrap180;
let state = null, dests = [], destIdx = -1, mapOn = false, pack = null, SCH = null;
/* floors with traced walls come from schematic.json; every other plan gets a schematic built from its surveyed corridors, stairs and exits */
Promise.all([fetch('pack/indoor/schematic.json').then(r => r.json()).catch(() => ({ plans: {} })), fetch('pack/indoor/default.json').then(r => r.json()).catch(() => ({ floors: [] }))]).then(([j, d]) => { const P = j.plans || {};
  for (const f of d.floors) { if (!f.m_per_px) continue; const t = P[f.id] || {}, traced = (t.walls && t.walls.length) || t.floor;
    P[f.id] = { solid: [], furn: [], walls: [], ...t, mpp: f.m_per_px, up: f.up_bearing_deg, floorLabel: f.label, corr: traced ? null : f.paths || [],
      exits: t.exits || (f.dests || []).filter(x => /^(Stair|Exit)/.test(x.name)).map(x => ({ p: x.p, t: x.name.replace(/^Exit.*/, 'EXIT').toUpperCase() })),
      labels: t.labels || (f.dests || []).filter(x => !/^(Stair|Exit)/.test(x.name)).map(x => ({ t: x.name.replace('Elevator Bank B', 'ELEVATORS').replace(/ \(.*/, '').toUpperCase(), p: x.p, pri: 2 })) }; }
  SCH = P; });
let rawHeading = null, absolute = false, offset = 0, aligned = false, sensorsOn = false, lastOrient = 0, shown = 0;

function onOrient(e) {
  lastOrient = Date.now();
  if (typeof e.webkitCompassHeading === 'number') { rawHeading = e.webkitCompassHeading; absolute = true; }
  else if (e.absolute && typeof e.alpha === 'number') { rawHeading = (360 - e.alpha) % 360; absolute = true; }
  else if (!absolute && typeof e.alpha === 'number') { rawHeading = (360 - e.alpha) % 360; }
}
const live = () => rawHeading !== null && Date.now() - lastOrient < 3000;
/* Heading used for the arrow:
     aligned  -> the photo's solved heading plus how far the head has turned since ALIGN (the sensor is used only for the change)
     compass  -> the device's own north, when it reports one and ALIGN has not been pressed
     none     -> arrow is drawn relative to the photo's view direction */
const heading = () => !live() ? null : aligned ? (rawHeading + offset + 720) % 360 : absolute ? rawHeading : null;
function align() { if (state && live() && typeof state.fix.heading === 'number') { offset = state.fix.heading - rawHeading; aligned = true; } }
async function enableSensors() {
  for (const Ev of [window.DeviceOrientationEvent, window.DeviceMotionEvent]) { try { if (Ev && typeof Ev.requestPermission === 'function') await Ev.requestPermission(); } catch (_) {} }
  if (!sensorsOn) { addEventListener('deviceorientationabsolute', onOrient); addEventListener('deviceorientation', onOrient); sensorsOn = true; }
}
addEventListener('deviceorientationabsolute', onOrient); addEventListener('deviceorientation', onOrient);

function onState(s) {
  state = s; destIdx = -1; dests = []; aligned = false;
  if (s.fix.indoor && s.fix.plan && !mapOn) $('bMap').click();                      // indoors the floor schematic is the main view
  const t = new Date(s.t); $('fixinfo').innerHTML = `FIX ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} ±${Math.round(s.fix.ring || 0)} m` + (s.fix.floor ? `<br>FLOOR ~${s.fix.floor}` : '');
}
const target = () => !state ? null : destIdx >= 0 ? dests[destIdx] : state.dest;
const route = () => state && state.route && destIdx < 0 ? state.route : null;      // corridor route from the phone; cycling DEST here drops back to a straight line

function render() {
  const d = target(), h = heading();
  if (!state || !d) {
    $('arrow').setAttribute('class', 'lost'); $('dist').textContent = '--'; $('dest').textContent = '';
    $('status').textContent = state ? 'Pick a destination on the phone, or DEST ▸' : 'Waiting for a fix from the phone…'; $('status').className = 'warn';
  } else {
    const R = route(), aim = R && R.pts.length > 1 ? R.pts[1] : d;                  // arrow points down the first leg of the route
    const brg = PG.bearingLL(state.fix.lat, state.fix.lon, aim.lat, aim.lon), dist = R ? R.total : PG.haversine(state.fix.lat, state.fix.lon, d.lat, d.lon);
    const ref = h !== null ? h : (typeof state.fix.heading === 'number' ? state.fix.heading : 0), rel = norm180(brg - ref);
    shown += norm180(rel - shown) * 0.35; $('arrow').style.transform = `rotate(${shown}deg)`;
    const ahead = Math.abs(rel) <= AHEAD; $('arrow').setAttribute('class', ahead ? 'ahead' : '');
    $('dist').textContent = dist >= 1000 ? (dist / 1000).toFixed(1) + ' km' : Math.round(dist) + ' m';
    $('dest').textContent = (d.name || '') + (R && R.steps.length > 1 ? ` · then ${R.steps[1].turn} after ${R.steps[0].m} m` : '');
    const card = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(brg / 45) % 8];
    $('status').textContent = (ahead ? 'STRAIGHT AHEAD' : Math.abs(rel) > 150 ? 'TURN AROUND' : rel > 0 ? 'TURN RIGHT' : 'TURN LEFT') + (state.fix.indoor ? '' : ` · ${Math.round(brg)}° ${card}`) + (h === null ? ' (from photo view)' : '');
    $('status').className = ahead ? 'ahead' : '';
  }
  $('hdg').textContent = !live() ? (sensorsOn ? 'HDG -- (no sensor)' : 'ALIGN to enable heading') : aligned ? `HDG ${Math.round(heading())}° photo` : absolute ? `HDG ${Math.round(heading())}° compass` : 'Face where you shot, then ALIGN';
  const sch = mapOn && state && state.fix.indoor && SCH && state.fix.px && SCH[state.fix.plan]; $('hdg').style.display = $('fixinfo').style.display = sch ? 'none' : '';
  if (mapOn) drawMap();
  requestAnimationFrame(render);
}

/* heading-up vector map of the block: streets + footprints from the offline pack, monochrome-friendly */
async function loadPack() {
  if (pack) return pack;
  const [o, b] = await Promise.all([fetch('pack/osm.json').then(r => r.json()), fetch('pack/buildings.json').then(r => r.json())]);
  pack = { streets: o.streets.filter(s => s.name && !['footway', 'steps', 'service', 'cycleway', 'path'].includes(s.kind)), bld: b.buildings.filter(x => x.d < 450), corners: o.corners, places: o.places };
  return pack;
}
/* Indoor: a heading-up schematic of the floor around the wearer. Walls thin and cool, the route thick green with chevrons,
   exits and stairs red, the target amber. Few labels, none overlapping. Black stays transparent on the waveguide. */
function drawSchematic(g) {
  const f = state.fix, pl = SCH[f.plan], S = f.plan === 'a105' ? 17 : 10.5, cx = 300, cy = 410, k = pl.mpp * S;
  const h = heading(), hp = ((h !== null ? h : f.heading) - pl.up) * PG.D2R, c = Math.cos(hp), sn = Math.sin(hp);
  const P = (x, y) => { const dx = (x - f.px[0]) * k, dy = (y - f.px[1]) * k; return [cx + dx * c + dy * sn, cy - dx * sn + dy * c]; };
  const seg = (L, col, w) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); for (const q of L) { const a = P(q[0], q[1]), b = P(q[2], q[3]); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); } g.stroke(); };
  g.save(); g.beginPath(); g.rect(0, 84, 600, 404); g.clip(); g.lineCap = 'round'; g.lineJoin = 'round';
  for (const poly of pl.solid) { g.fillStyle = 'rgba(255,140,60,.16)'; g.strokeStyle = '#a8592a'; g.lineWidth = 2; g.beginPath(); poly.forEach((q, i) => { const a = P(q[0], q[1]); i ? g.lineTo(a[0], a[1]) : g.moveTo(a[0], a[1]); }); g.closePath(); g.fill(); g.stroke(); }
  if (pl.corr) { const cor = (col, w) => { g.strokeStyle = col; g.lineWidth = w; for (const L of pl.corr) { g.beginPath(); L.forEach((q, i) => { const a = P(q[0], q[1]); i ? g.lineTo(a[0], a[1]) : g.moveTo(a[0], a[1]); }); g.stroke(); } }; cor('#8fdcff', 2.6 * S + 5); cor('#06141b', 2.6 * S); }   // corridors: outlined bands about 2.6 m wide
  if (pl.floor) for (const poly of pl.floor) { g.fillStyle = 'rgba(143,220,255,.09)'; g.strokeStyle = '#8fdcff'; g.lineWidth = 3; g.beginPath(); poly.forEach((q, i) => { const a = P(q[0], q[1]); i ? g.lineTo(a[0], a[1]) : g.moveTo(a[0], a[1]); }); g.closePath(); g.fill(); g.stroke(); }   // floor area as drawn on the fire sign
  seg(pl.furn, '#3d5560', 1.5); seg(pl.walls, pl.floor ? '#5aa0bd' : '#8fdcff', pl.floor ? 1.6 : 3);
  const R = route(), d = target(), boxes = [], free = (x, y, w, hh) => { if (x < 6 || x + w > 594 || y < 90 || y + hh > 484) return false; for (const b of boxes) if (x < b[0] + b[2] && x + w > b[0] && y < b[1] + b[3] && y + hh > b[1]) return false; boxes.push([x, y, w, hh]); return true; };
  boxes.push([cx - 26, cy - 30, 52, 60]);
  if (R && R.px && R.px.length > 1) { const pts = R.px.map(q => P(q[0], q[1]));
    g.strokeStyle = '#0a3d1c'; g.lineWidth = 15; g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.stroke();
    g.strokeStyle = '#3dff7a'; g.lineWidth = 8; g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.stroke();
    g.fillStyle = '#04140a'; for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.floor(L / 46), an = Math.atan2(b[1] - a[1], b[0] - a[0]);
      for (let j = 1; j <= n; j++) { const t = j / (n + 1), x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t; g.save(); g.translate(x, y); g.rotate(an); g.beginPath(); g.moveTo(5, 0); g.lineTo(-3, -4); g.lineTo(-3, 4); g.closePath(); g.fill(); g.restore(); } }
    const e = pts[pts.length - 1]; boxes.push([e[0] - 16, e[1] - 16, 32, 32]); g.fillStyle = '#000'; g.strokeStyle = '#ffc400'; g.lineWidth = 5; g.beginPath(); g.arc(e[0], e[1], 12, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#ffc400'; g.beginPath(); g.arc(e[0], e[1], 4.5, 0, 7); g.fill(); }
  g.font = 'bold 15px system-ui'; g.textBaseline = 'middle';
  for (const x of pl.exits) { const a = P(x.p[0], x.p[1]), w = g.measureText(x.t).width + 14; if (a[0] < 20 || a[0] > 580 || a[1] < 98 || a[1] > 474) continue; boxes.push([a[0] - w / 2, a[1] - 12, w, 24]);
    g.fillStyle = '#ff3b30'; g.beginPath(); g.roundRect(a[0] - w / 2, a[1] - 12, w, 24, 5); g.fill(); g.fillStyle = '#fff'; g.fillText(x.t, a[0] - w / 2 + 7, a[1] + 1); }
  g.font = '600 16px system-ui'; for (const L of pl.labels.slice().sort((a, b) => a.pri - b.pri)) { const a = P(L.p[0], L.p[1]), w = g.measureText(L.t).width; if (free(a[0] - w / 2 - 4, a[1] - 11, w + 8, 22)) { g.fillStyle = L.pri === 1 ? '#fff' : '#9fb6c2'; g.fillText(L.t, a[0] - w / 2, a[1] + 1); } }
  g.restore();
  g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 3; g.beginPath(); g.moveTo(cx, cy - 24); g.lineTo(cx + 15, cy + 14); g.lineTo(cx, cy + 5); g.lineTo(cx - 15, cy + 14); g.closePath(); g.stroke(); g.fill();
  /* top: the next move, big. bottom line: how far, and to what */
  const st = R && R.steps ? R.steps : [], ICON = { AHEAD: '↑', LEFT: '↰', RIGHT: '↱', 'BEAR LEFT': '↖', 'BEAR RIGHT': '↗', 'TURN AROUND': '↶' }; let s0 = st[0], s1 = st[1];
  if (s0 && !s0.vertical && s0.m < 1 && s1 && s1.vertical) { s0 = s1; s1 = null; }                      // standing at the door or stair: the door or stair is the next move
  const soft = t => t.split(',')[0], arrived = R && !st.some(x => x.vertical) && R.total <= 1.5;
  let top = '', col = '#3dff7a'; if (arrived) top = '✓ ARRIVED'; else if (s0) { top = s0.vertical ? soft(s0.turn) : `${ICON[s0.turn] || ''} ${s0.turn}${s0.m ? ' ' + s0.m + ' m' : ''}`; if (s0.turn === 'TURN AROUND' || s0.vertical) col = '#ffc400'; }
  g.textAlign = 'center'; g.font = `bold ${top.length > 22 ? 28 : 34}px system-ui`; g.fillStyle = col; g.fillText(top, 300, 40);
  if (s1 && !arrived) { g.font = '600 19px system-ui'; g.fillStyle = '#cfd8dc'; g.fillText('then ' + (s1.vertical ? soft(s1.turn).replace(/^THROUGH/, 'through').replace(/^TAKE/, 'take').replace(' TO FLOOR ', ' to floor ') : `${ICON[s1.turn] || ''} ${s1.turn.toLowerCase()}${s1.m ? ' ' + s1.m + ' m' : ''}`), 300, 70); }
  if (d) { g.font = 'bold 22px system-ui'; g.fillStyle = '#ffc400'; const nm = (d.name || '').replace(/^.*→ /, '').replace(/^floor (\d+): /, 'F$1 · ').replace('Exit: ', 'EXIT · '); g.fillText(`${R && !arrived ? Math.round(R.total) + ' m · ' : ''}${nm.slice(0, 36)}`, 300, 516); }
  if (pl.floorLabel) { g.textAlign = 'left'; g.font = 'bold 18px system-ui'; g.fillStyle = '#8fdcff'; g.fillText('FLOOR ' + pl.floorLabel, 14, 22); }
  g.textAlign = 'left';
}
function drawMap() {
  const cv = $('map'), g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 600, 600);
  if (state && state.fix.indoor && SCH && state.fix.plan && SCH[state.fix.plan] && state.fix.px) return drawSchematic(g);
  if (!state || (!pack && !state.fix.indoor)) return;
  const indoor = !!state.fix.indoor, loc = PG.Local(state.fix.lat, state.fix.lon), h = heading(), rot = -((h !== null ? h : state.fix.heading || 0) * PG.D2R), S = indoor ? 5 : 1.25;   // px per metre
  const P = (lat, lon) => { const [e, n] = loc.en(lat, lon), x = e * Math.cos(rot) - n * Math.sin(rot), y = e * Math.sin(rot) + n * Math.cos(rot); return [300 + x * S, 380 - y * S]; };
  if (indoor) { g.font = '18px system-ui'; for (const d of state.dests || []) { const [x, y] = P(d.lat, d.lon); if (x < 10 || x > 590 || y < 40 || y > 540) continue; g.fillStyle = '#cfcfcf'; g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill(); g.fillStyle = '#fff'; g.fillText(d.name.slice(0, 22), x + 9, y + 6); } }
  g.lineWidth = 1.5; g.strokeStyle = '#2f7d4c';
  for (const b of indoor ? [] : pack.bld) { g.beginPath(); b.ring.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); }
  g.strokeStyle = '#cfcfcf'; g.lineWidth = 2.5; const seen = {};
  for (const s of indoor ? [] : pack.streets) {
    g.beginPath(); s.pts.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    const m = s.pts[Math.floor(s.pts.length / 2)], [x, y] = P(m[0], m[1]), k = s.name + Math.round(x / 150) + Math.round(y / 150);
    if (!seen[k] && x > 30 && x < 520 && y > 60 && y < 520) { seen[k] = 1; g.fillStyle = '#fff'; g.font = '17px system-ui'; g.fillText(s.name.replace(' Street', ' St').replace(' Place', ' Pl').replace(' Avenue', ' Av'), x + 4, y - 4); }
  }
  const d = target();
  const RT = route();
  if (d && RT) { g.strokeStyle = '#3dff7a'; g.lineWidth = 5; g.lineJoin = 'round'; g.beginPath(); RT.pts.forEach((q, i) => { const [x, y] = P(q.lat, q.lon); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); }
  if (d) { const [x, y] = P(d.lat, d.lon); if (!RT) { g.strokeStyle = '#3dff7a'; g.lineWidth = 3; g.setLineDash([8, 6]); g.beginPath(); g.moveTo(300, 380); g.lineTo(x, y); g.stroke(); g.setLineDash([]); } g.fillStyle = '#3dff7a'; g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); }
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(300, 360); g.lineTo(313, 392); g.lineTo(300, 384); g.lineTo(287, 392); g.closePath(); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath(); g.arc(300, 380, Math.max(6, (state.fix.ring || 0) * S), 0, 7); g.stroke();
}

$('bCal').onclick = async () => { await enableSensors(); setTimeout(align, live() ? 0 : 500); };
$('bDest').onclick = async () => {
  if (state && state.dests && state.dests.length) { dests = state.dests; destIdx = (destIdx + 1) % dests.length; return; }
  await loadPack(); if (!dests.length) dests = [...pack.corners, ...pack.places.filter(p => ['subway_entrance', 'station', 'cafe', 'park', 'library', 'university', 'hotel'].includes(p.kind) && p.name && state && PG.haversine(state.fix.lat, state.fix.lon, p.lat, p.lon) < 450).slice(0, 14)];
  destIdx = (destIdx + 1) % dests.length;
};
$('bMap').onclick = async () => { if (!(state && state.fix.indoor)) await loadPack(); mapOn = !mapOn; $('map').style.display = mapOn ? 'block' : 'none'; $('arrowView').style.display = mapOn ? 'none' : 'flex'; $('bMap').textContent = mapOn ? 'ARROW' : 'MAP'; };
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.activeElement && document.activeElement.click && document.activeElement.tagName !== 'BUTTON') $('bCal').click(); });
$('bCal').focus();

if (params.get('demo') === '1') onState({ t: Date.now(), fix: { lat: 40.695496, lon: -73.986565, ring: 15, heading: 0, floor: 4 }, dest: { name: 'Jay & Tillary (NW corner)', lat: 40.696132, lon: -73.987103 } });
PGSync.subscribe(onState);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
