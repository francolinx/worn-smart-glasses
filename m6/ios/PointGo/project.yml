# Backup: if PointGo.xcodeproj will not open, run `brew install xcodegen && xcodegen` in this folder to regenerate it.
name: PointGo
options: { bundleIdPrefix: com.CHANGEME, deploymentTarget: { iOS: "15.0" } }
targets:
  PointGo:
    type: application
    platform: iOS
    sources: [PointGo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.CHANGEME.pointgo
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Point & Go
        INFOPLIST_KEY_NSCameraUsageDescription: Takes the photo that tells you where you are in the building.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Lets you pick a photo taken by the glasses.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Not used. iOS asks for it with the camera.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
