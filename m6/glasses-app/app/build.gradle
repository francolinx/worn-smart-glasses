// Point & Go display app for the MicroLumin M6 glasses (Android 9, 640x480). Plain Android: no MicroLumin SDK, no other libraries.
plugins { id 'com.android.application' }
android {
    namespace 'com.pointgo.glasses'
    compileSdk 34
    defaultConfig { applicationId 'com.pointgo.glasses'; minSdk 24; targetSdk 28; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}
